# Builds the DOK container image and pushes it to the private Sakura Cloud container registry.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   SAKURA_REGISTRY           e.g. klayer.sakuracr.jp
#   SAKURA_REGISTRY_USER      a registry user with push permission
#   SAKURA_REGISTRY_PASSWORD  that user's password
# Runs on pushes to main that change the image, or by hand from the Actions tab.
name: image

on:
  push:
    branches: [main]
    paths: [Dockerfile, requirements.txt, run.sh, "bench/**", "vqe/**", .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The CUDA-Q wheels unpack to ~4 GB; the stock runner is short of disk without this.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SAKURA_REGISTRY }}
          username: ${{ secrets.SAKURA_REGISTRY_USER }}
          password: ${{ secrets.SAKURA_REGISTRY_PASSWORD }}

      - name: Build
        run: docker build -t sakura-quantum .

      # Only push an image that runs: CPU smoke test (the GPU targets skip themselves)
      - name: Smoke-test on CPU
        run: docker run --rm sakura-quantum smoke

      - name: Push
        env:
          REGISTRY: ${{ secrets.SAKURA_REGISTRY }}
        run: |
          for tag in latest "$GITHUB_SHA"; do
            docker tag sakura-quantum "$REGISTRY/sakura-quantum:$tag"
            docker push "$REGISTRY/sakura-quantum:$tag"
          done
